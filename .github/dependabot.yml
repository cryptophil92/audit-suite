version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - ci
      - technical-debt
    commit-message:
      prefix: "ci"

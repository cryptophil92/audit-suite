name: ShellCheck

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck Bash scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Run ShellCheck and capture output
        run: |
          set +e
          shellcheck \
            -e SC1090 \
            -e SC1091 \
            -e SC2016 \
            -e SC2034 \
            -e SC2154 \
            audit.sh \
            core/*.sh \
            bin/*.sh \
            modules/*.sh \
            ui/*.sh \
            tests/*.sh > shellcheck-output.txt 2>&1
          rc=$?
          echo "$rc" > shellcheck-exit-code.txt
          cat shellcheck-output.txt
          exit 0

      - name: Upload ShellCheck output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shellcheck-output
          path: |
            shellcheck-output.txt
            shellcheck-exit-code.txt

      - name: Run automatically discovered test suite
        run: bash bin/test_all.sh

      - name: Fail if ShellCheck failed
        run: |
          rc="$(cat shellcheck-exit-code.txt)"
          if [ "$rc" != "0" ]; then
            echo "ShellCheck failed with exit code $rc"
            exit "$rc"
          fi
